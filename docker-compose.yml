services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  model:
    build:
      context: ./model
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: 8001
    ports:
      - "${MODEL_BIND_IP:-127.0.0.1}:${MODEL_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${BACKEND_ENV_FILE:-./backend-node/.env}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
      PORT: 8082
      BASE_SERVER_URL: ${BASE_SERVER_URL:-http://127.0.0.1:8097}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSITIONING_MODE: http
      POSITIONING_SERVICE_URL: http://model:8001
      POSITIONING_SERVICE_TIMEOUT_MS: ${POSITIONING_SERVICE_TIMEOUT_MS:-5000}
    depends_on:
      redis:
        condition: service_healthy
      model:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-8097}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  redis-data:
